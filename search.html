<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentMatch AI — Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span>
          <span class="brand-name">RentMatch AI</span><br />
          <span class="brand-tag">Smart rental matching</span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="index.html">Home</a>
        <a href="search.html" data-nav="search.html">Search</a>
        <a href="compare.html" data-nav="compare.html">Compare</a>
        <a href="shortlist.html" data-nav="shortlist.html">Shortlist</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-header">
      <h1>Search properties</h1>
      <p>Filter the listings directly. <span id="result-count"></span></p>
    </div>

    <div class="req-panel">
      <form class="req-body" id="search-form">
        <div class="field-grid">
          <div class="field">
            <label for="area">Area or name</label>
            <input type="text" id="area" placeholder="e.g. MG Road" autocomplete="off" />
          </div>
          <div class="field">
            <label for="maxRent">Max rent (₹/mo)</label>
            <input type="number" id="maxRent" min="1" step="1" placeholder="e.g. 8000" autocomplete="off" />
          </div>
          <div class="field">
            <label for="maxDeposit">Max deposit (₹)</label>
            <input type="number" id="maxDeposit" min="1" step="1" placeholder="e.g. 25000" autocomplete="off" />
          </div>
          <div class="field">
            <label for="sharing">Sharing</label>
            <select id="sharing">
              <option value="">Any</option>
              <option value="1">1 sharing</option>
              <option value="2">2 sharing</option>
              <option value="3">3 sharing</option>
            </select>
          </div>
          <div class="field">
            <label for="furnished">Furnishing</label>
            <select id="furnished">
              <option value="">Any</option>
              <option value="Furnished">Furnished</option>
              <option value="Semi-furnished">Semi-furnished</option>
              <option value="Unfurnished">Unfurnished</option>
            </select>
          </div>
          <div class="field">
            <label for="foodPolicy">Food policy</label>
            <select id="foodPolicy">
              <option value="">Any</option>
              <option value="Any">No restriction</option>
              <option value="Veg only">Veg only</option>
            </select>
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="">Default order</option>
              <option value="rent_asc">Rent: low to high</option>
              <option value="rent_desc">Rent: high to low</option>
              <option value="deposit_asc">Deposit: low to high</option>
              <option value="distance_asc">Distance: nearest first</option>
            </select>
          </div>

          <div class="field facility-group">
            <label>Facilities (must have all selected)</label>
            <div class="facility-options">
              <label><input type="checkbox" name="facilities" value="Wi-Fi" /> Wi-Fi</label>
              <label><input type="checkbox" name="facilities" value="Washing machine" /> Washing machine</label>
              <label><input type="checkbox" name="facilities" value="Attached bathroom" /> Attached bathroom</label>
            </div>
          </div>
        </div>

        <div class="req-actions">
          <button type="submit" class="btn">Search</button>
          <button type="reset" class="btn btn-secondary">Clear filters</button>
        </div>
      </form>
    </div>

    <p class="location-status" id="search-status"></p>
    <div class="property-list" id="search-results"></div>
  </main>

  <script src="script.js"></script>
  <script src="search-page.js"></script>
</body>
</html>
