<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentMatch AI — Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span>
          <span class="brand-name">RentMatch AI</span><br />
          <span class="brand-tag">Smart rental matching</span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="index.html">Home</a>
        <a href="compare.html" data-nav="compare.html">Compare</a>
        <a href="shortlist.html" data-nav="shortlist.html">Shortlist</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-header">
      <h1 id="area-heading">Your matches</h1>
      <p>Ranked by your priorities &middot; <span id="result-count">8</span> properties analysed by the matching engine</p>
    </div>

    <details class="req-panel" id="req-panel" open>
      <summary>
        <div class="req-summary-row" id="req-summary"></div>
        <button type="button" class="btn" id="edit-requirements">Edit requirements</button>
      </summary>

      <form class="req-body" id="requirements-form">
        <div class="field-grid">
          <div class="field facility-group">
            <label for="location">Your location / college (matches are ranked relative to this)</label>
            <div class="location-row">
              <input type="text" id="location" placeholder="e.g. MG Road, near St. Joseph's College" required />
              <button type="button" class="btn btn-secondary" id="locate-address">Find on map</button>
              <button type="button" class="btn btn-secondary" id="use-current-location">📍 Use my location</button>
            </div>
            <p class="location-status" id="location-status"></p>
          </div>
          <div class="field">
            <label for="budget">Budget (₹/mo)</label>
            <input type="number" id="budget" min="0" step="100" placeholder="e.g. 8000" required />
          </div>
          <div class="field">
            <label for="maxDistance">Max distance (km)</label>
            <input type="number" id="maxDistance" min="0" step="0.1" placeholder="e.g. 3" required />
          </div>
          <div class="field">
            <label for="maxTravelTime">Max travel time (min)</label>
            <input type="number" id="maxTravelTime" min="0" step="1" placeholder="e.g. 25" required />
          </div>
          <div class="field">
            <label for="maxDeposit">Max deposit (₹)</label>
            <input type="number" id="maxDeposit" min="0" step="500" placeholder="e.g. 25000" required />
          </div>
          <div class="field">
            <label for="sharing">Preferred sharing</label>
            <select id="sharing" required>
              <option value="" disabled selected>Select...</option>
              <option value="1">1 sharing</option>
              <option value="2">2 sharing</option>
              <option value="3">3 sharing</option>
            </select>
          </div>
          <div class="field">
            <label for="furnished">Furnishing</label>
            <select id="furnished" required>
              <option value="" disabled selected>Select...</option>
              <option value="Furnished">Furnished</option>
              <option value="Semi-furnished">Semi-furnished</option>
              <option value="Unfurnished">Unfurnished</option>
            </select>
          </div>
          <div class="field">
            <label for="foodPolicy">Food policy</label>
            <select id="foodPolicy" required>
              <option value="" disabled selected>Select...</option>
              <option value="Any">Any</option>
              <option value="Veg only">Veg only</option>
            </select>
          </div>

          <div class="field facility-group">
            <label>Required facilities</label>
            <div class="facility-options">
              <label><input type="checkbox" name="facilities" value="Wi-Fi" /> Wi-Fi</label>
              <label><input type="checkbox" name="facilities" value="Washing machine" /> Washing machine</label>
              <label><input type="checkbox" name="facilities" value="Attached bathroom" /> Attached bathroom</label>
            </div>
          </div>
        </div>

        <div class="req-actions">
          <button type="submit" class="btn">Save requirements</button>
        </div>
      </form>
    </details>

    <div class="picks" id="ai-picks"></div>

    <div class="property-list" id="property-list"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
